services:
  - type: web
    name: ideanick-backend
    runtime: node
    rootDir: .
    buildCommand: |
      rm -rf backend/node_modules/@ideanick
      mkdir -p backend/node_modules/@ideanick
      cp -r shared/dist backend/node_modules/@ideanick/shared
      npm install --legacy-peer-deps --ignore-scripts
    startCommand: node backend/dist/index.js

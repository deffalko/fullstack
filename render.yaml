services:
  - type: web
    name: ideanick
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ping
    envVars:
      # Основные
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: HOST_ENV
        value: production

      # База данных
      - key: DATABASE_URL
        fromDatabase:
          name: ideanick-db
          property: connectionString

      # Безопасность (введите на Render)
      - key: JWT_SECRET
        sync: false
      - key: PASSWORD_SALT
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

      # URLs
      - key: WEBAPP_URL
        value: https://ideanick.onrender.com
      - key: VITE_BACKEND_TRPC_URL
        value: https://ideanick.onrender.com/trpc
      - key: VITE_WEBAPP_URL
        value: https://ideanick.onrender.com

      # Email (Brevo) - введите на Render
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL_NAME
        value: ideaNick
      - key: FROM_EMAIL_ADDRESS
        value: noreply@idea-back.ru

      # Debug
      - key: DEBUG
        value: 'ideanick:*,-ideanick:prisma:*,-ideanick:trpc:query:success'

      # Rollbar - введите на Render
      - key: ROLLBAR_SERVER_ACCESS_TOKEN
        sync: false
      - key: VITE_WEBAPP_ROLLBAR_CLIENT_TOKEN
        sync: false
      - key: WEBAPP_ROLLBAR_ACCESS_TOKEN
        sync: false
      - key: VITE_WEBAPP_ROLLBAR_ACCESS_TOKEN
        sync: false

      # Cloudinary - введите на Render
      - key: CLOUDINARY_CLOUD_NAME
        value: fdh7j6da
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        value: fdh7j6da

      # S3
      - key: S3_URL
        value: https://example-bucket.s3.amazonaws.com
      - key: VITE_S3_URL
        value: https://example-bucket.s3.amazonaws.com

      # Версия
      - key: SOURCE_VERSION
        value: '123'

databases:
  - name: ideanick-db
    databaseName: ideanick
    user: ideanick
    plan: free

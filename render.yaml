services:
  - type: web
    name: ideanick
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ping
    envVars:
      # Основные
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: HOST_ENV
        value: production

      # База данных
      - key: DATABASE_URL
        fromDatabase:
          name: ideanick-db
          property: connectionString

      # Безопасность
      - key: JWT_SECRET
        value: local-jwt-secret
      - key: PASSWORD_SALT
        value: local-password-salt
      - key: INITIAL_ADMIN_PASSWORD
        value: '1234'

      # URLs
      - key: WEBAPP_URL
        value: https://ideanick.onrender.com
      - key: VITE_BACKEND_TRPC_URL
        value: https://ideanick.onrender.com/trpc
      - key: VITE_WEBAPP_URL
        value: https://ideanick.onrender.com

      # Email (Brevo)
      - key: BREVO_API_KEY
        value: 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
      - key: FROM_EMAIL_NAME
        value: ideaNick
      - key: FROM_EMAIL_ADDRESS
        value: noreply@idea-back.ru

      # Debug
      - key: DEBUG
        value: 'ideanick:*,-ideanick:prisma:*,-ideanick:trpc:query:success'

      # Rollbar
      - key: ROLLBAR_SERVER_ACCESS_TOKEN

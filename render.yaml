      - key: VITE_WEBAPP_ROLLBAR_CLIENT_TOKEN
        value: 441f6e46a49c4f65aea2f9c5822261cb4cf014ee998cc01c520dae1df5610aaf80d980eb5e5478f6d05962c6ece82942
      - key: WEBAPP_ROLLBAR_ACCESS_TOKEN
